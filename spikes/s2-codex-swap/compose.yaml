name: terrarium-s2

services:
  gateway:
    build: ./proxy
    environment:
      PLACEHOLDER_ACCESS_TOKEN: ${PLACEHOLDER_ACCESS_TOKEN:?run forge.sh and export PLACEHOLDER_ACCESS_TOKEN}
      PLACEHOLDER_AUTH_JSON_PATH: /placeholder/auth.json
      REAL_AUTH_JSON_PATH: /secrets/auth.json
      CONNECT_ALLOW: ${CONNECT_ALLOW:-}
    volumes:
      - ./.generated/auth.json:/placeholder/auth.json:ro
      # Phase 1: a fake file. Phase 2: the host's real ~/.codex/auth.json (gateway only).
      - ${REAL_CODEX_AUTH_JSON:?set REAL_CODEX_AUTH_JSON}:/secrets/auth.json:ro
    networks: [sandbox-net, egress]

  agent:
    build: ./agent
    environment:
      CODEX_REFRESH_TOKEN_URL_OVERRIDE: http://gateway:8080/oauth/token
      CODEX_REVOKE_TOKEN_URL_OVERRIDE: http://gateway:8080/oauth/revoke
      HTTPS_PROXY: http://gateway:3128
      HTTP_PROXY: http://gateway:3128
      NO_PROXY: gateway
    volumes:
      - ./.generated/auth.json:/etc/terrarium/codex/auth.json:ro
      - ./.generated/config.toml:/etc/terrarium/codex/config.toml:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [sandbox-net]
    depends_on: [gateway]

networks:
  sandbox-net:
    internal: true
  egress: {}
