# Session presets. Resolved and frozen into the SessionSpec at creation; editing this file
# affects only new sessions.
defaults:
  image: terrarium-agent:local
  resources: { cpus: 2, memory_mb: 4096, pids: 1024 }
  # CONNECT allowlist. GitHub is not on it: git and PRs go through the gateway's /github/ route,
  # which is limited to the session's repository.
  network:
    allow: [registry.npmjs.org, pypi.org, files.pythonhosted.org]
  # What happens when a turn ends and no follow-up is queued: terminate (end the session, destroy
  # the sandbox) or keep_idle (wait for follow-ups). POST /sessions "keep_idle": true keeps idle
  # on every outcome.
  lifecycle: { on_complete: terminate, on_failure: terminate, on_stop: keep_idle }
  # Injection guard on tool output sent to the model: off, monitor (record a flagged egress event)
  # or block (refuse the inference request). Regex only, so it catches naive payloads; repos that
  # discuss prompt injection will trip it, which is why the default only records.
  guard: monitor
  limits:
    max_agent_steps: 50
    token_budget: 2000000
    idle_timeout_seconds: 1800
    ttl_seconds: 14400

presets:
  default: {}

  # Narrow preset for read-only exploration of a public repository.
  explore:
    network: { allow: [] }
    limits: { max_agent_steps: 30, token_budget: 500000 }
