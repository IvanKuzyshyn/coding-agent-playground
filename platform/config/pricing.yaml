# API list prices, USD per 1M tokens, used only for the "API-equivalent cost" estimate shown for
# subscription runs. Subscriptions are not billed per token.
# Sources: https://platform.claude.com/docs/en/about-claude/pricing,
#          https://developers.openai.com/api/docs/pricing — checked 2026-10-10.
# cache_write = 5-minute cache write; cache_read = cache hit. `long` applies to the whole request
# when its prompt (input + cache reads + cache writes) exceeds `above` tokens.
# Not modelled: Claude US-only inference (x1.1), fast mode, 1-hour cache writes, OpenAI regional
# endpoints and Batch/Flex tiers.
models:
  # Anthropic
  claude-fable-5-1:   { input: 10.0, output: 50.0, cache_write: 12.5,  cache_read: 0.25 }
  claude-fable-5:     { input: 10.0, output: 50.0, cache_write: 12.5,  cache_read: 1.0 }
  claude-opus-5-5:    { input: 4.0,  output: 20.0, cache_write: 5.0,   cache_read: 0.20 }
  claude-opus-5:      { input: 5.0,  output: 25.0, cache_write: 6.25,  cache_read: 0.50 }
  claude-opus-4-8:    { input: 5.0,  output: 25.0, cache_write: 6.25,  cache_read: 0.50 }
  claude-opus-4-7:    { input: 5.0,  output: 25.0, cache_write: 6.25,  cache_read: 0.50 }
  claude-opus-4-6:    { input: 5.0,  output: 25.0, cache_write: 6.25,  cache_read: 0.50 }
  claude-opus-4-5:    { input: 5.0,  output: 25.0, cache_write: 6.25,  cache_read: 0.50 }
  claude-sonnet-5-5:  { input: 2.0,  output: 10.0, cache_write: 2.5,   cache_read: 0.10 }
  claude-sonnet-5:    { input: 2.0,  output: 10.0, cache_write: 2.5,   cache_read: 0.20 }
  claude-sonnet-4-6:  { input: 3.0,  output: 15.0, cache_write: 3.75,  cache_read: 0.30 }
  claude-sonnet-4-5:  { input: 3.0,  output: 15.0, cache_write: 3.75,  cache_read: 0.30 }
  claude-haiku-5-5:
    { input: 0.10, output: 0.50, cache_write: 0.125, cache_read: 0.01,
      long: { above: 100000, input: 0.50, output: 2.50, cache_write: 0.625, cache_read: 0.05 } }
  claude-haiku-4-5:   { input: 1.0,  output: 5.0,  cache_write: 1.25,  cache_read: 0.10 }

  # OpenAI (standard tier)
  gpt-6.1-sol:
    { input: 2.0, output: 10.0, cache_read: 0.10,
      long: { above: 272000, input: 4.0, output: 15.0, cache_read: 0.20 } }
  gpt-6-sol:
    { input: 2.0, output: 10.0, cache_read: 0.20,
      long: { above: 272000, input: 4.0, output: 15.0, cache_read: 0.40 } }
  gpt-6-astra:
    { input: 10.0, output: 50.0, cache_read: 1.0,
      long: { above: 272000, input: 20.0, output: 75.0, cache_read: 2.0 } }
  gpt-6-luna:
    { input: 0.10, output: 0.50, cache_read: 0.01,
      long: { above: 272000, input: 0.20, output: 0.75, cache_read: 0.02 } }
  gpt-5.5:
    { input: 5.0, output: 30.0, cache_read: 0.50,
      long: { above: 272000, input: 10.0, output: 45.0, cache_read: 1.0 } }
